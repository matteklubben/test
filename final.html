<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Valvet är Öppet!</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .big-reveal-btn {
      width: 100%;
      padding: 26px 18px;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1.4;
      background: linear-gradient(135deg, #2b131d 0%, #14070c 100%);
      color: var(--gold-light, #f3d778);
      border: 2px solid var(--gold, #d4af37);
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 0 28px rgba(212, 175, 55, 0.3);
      transition: transform 0.15s, box-shadow 0.2s;
      margin: 12px 0;
    }
    .big-reveal-btn:active {
      transform: scale(0.97);
    }
    .final-video-box {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.45);
      margin: 14px 0 18px;
      background: #000;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
    }
    .final-video-box video {
      width: 100%;
      display: block;
      max-height: 48vh;
      object-fit: cover;
    }
    .code-display {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 18px 0;
    }
    .code-digit {
      width: 68px;
      height: 82px;
      background: #13060a;
      border: 2px solid var(--gold);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      font-weight: 900;
      color: var(--gold-light);
      box-shadow: 0 0 18px rgba(212, 175, 55, 0.3);
    }
    .btn-reset-final {
      margin-top: 22px;
      background: transparent;
      border: 1px solid rgba(212, 175, 55, 0.35);
      color: var(--gold-light);
      font-size: 0.85rem;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    canvas#confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>

  <div class="container">
    <div id="hud" class="hud-bar"></div>

    <!-- Steg 1: Stor knapp som låser upp ljudet i alla mobiler -->
    <div id="preRevealCard" class="card" style="text-align: center;">
      <button id="revealBtn" class="big-reveal-btn" onclick="revealFinale()">
        Grattis! Klicka här för att se koden.
      </button>
    </div>

    <!-- Steg 2: Filmen (med ljud på) och koden visas vid klick -->
    <div id="finaleCard" class="card" style="text-align: center; display: none;">
      <h2>🥂 Uppdraget Slutfört!</h2>
      <p class="muted">Ni har löst alla vinkällarens gåtor. Använd koden nedan för att öppna trälådans hänglås:</p>

      <div class="final-video-box">
        <video id="openVideo" src="open.mp4" playsinline controls></video>
      </div>

      <div id="codeBox" class="code-display"></div>

      <button class="btn-reset-final" onclick="restartAll()">↺ Nollställ och spela igen</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    try { saveProgress("final.html", 3); } catch (e) {}
    try { renderHUD("UPPLÅST • 3/3", 3); } catch (e) {}

    // Hämta er 3-siffriga kod oavsett hur den är döpt i config.js
    function resolveThreeDigitCode() {
      // 1. Om VAULT_CONFIG finns (digit1, digit2, digit3 eller code/lockCode)
      if (typeof VAULT_CONFIG !== "undefined" && VAULT_CONFIG) {
        if (VAULT_CONFIG.digit1 !== undefined && VAULT_CONFIG.digit2 !== undefined && VAULT_CONFIG.digit3 !== undefined) {
          return [VAULT_CONFIG.digit1, VAULT_CONFIG.digit2, VAULT_CONFIG.digit3];
        }
        const vCode = VAULT_CONFIG.code || VAULT_CONFIG.lockCode || VAULT_CONFIG.finalLockCode || VAULT_CONFIG.pin;
        if (vCode !== undefined) {
          return String(vCode).replace(/\D/g, "").slice(0, 3).split("");
        }
      }

      // 2. Om GAME_CONFIG finns (t.ex. finalLockCode, lockCode, code, pin eller digits)
      if (typeof GAME_CONFIG !== "undefined" && GAME_CONFIG) {
        if (Array.isArray(GAME_CONFIG.digits) && GAME_CONFIG.digits.length >= 3) {
          return GAME_CONFIG.digits.slice(0, 3);
        }
        if (GAME_CONFIG.digit1 !== undefined && GAME_CONFIG.digit2 !== undefined && GAME_CONFIG.digit3 !== undefined) {
          return [GAME_CONFIG.digit1, GAME_CONFIG.digit2, GAME_CONFIG.digit3];
        }
        const gCode = GAME_CONFIG.finalLockCode || GAME_CONFIG.lockCode || GAME_CONFIG.code || GAME_CONFIG.pin || GAME_CONFIG.vaultCode;
        if (gCode !== undefined) {
          return String(gCode).replace(/\D/g, "").slice(0, 3).split("");
        }
      }

      // 3. Om en fristående konstant som LOCK_CODE eller FINAL_CODE används
      if (typeof LOCK_CODE !== "undefined") return String(LOCK_CODE).replace(/\D/g, "").slice(0, 3).split("");
      if (typeof FINAL_CODE !== "undefined") return String(FINAL_CODE).replace(/\D/g, "").slice(0, 3).split("");

      // Fallback om inget hittas i config.js
      return ["7", "4", "9"];
    }

    const digits = resolveThreeDigitCode();
    const codeBox = document.getElementById("codeBox");
    codeBox.innerHTML = "";
    for (const ch of digits) {
      const div = document.createElement("div");
      div.className = "code-digit";
      div.textContent = ch;
      codeBox.appendChild(div);
    }

    function revealFinale() {
      document.getElementById("preRevealCard").style.display = "none";
      document.getElementById("finaleCard").style.display = "block";

      const video = document.getElementById("openVideo");
      video.muted = false;
      video.play();

      startConfetti();
    }

    function restartAll() {
      try {
        if (typeof resetProgress === "function") {
          resetProgress();
        } else {
          localStorage.removeItem("vinkallaren_escape_progress_v3");
        }
      } catch (e) {}
      window.location.href = "index.html";
    }

    function startConfetti() {
      const canvas = document.getElementById("confetti");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ["#d4af37", "#f3d778", "#9e1b3b", "#ffffff", "#ff6b8b"];
      const pieces = Array.from({ length: 95 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        r: Math.random() * 6 + 4,
        d: Math.random() * 3 + 2,
        color: colors[Math.floor(Math.random() * colors.length)]
      }));

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.r, p.r * 1.4);
          p.y += p.d;
          p.x += Math.sin(p.y * 0.03) * 1.2;
          if (p.y > canvas.height) {
            p.y = -10;
            p.x = Math.random() * canvas.width;
          }
        });
        requestAnimationFrame(draw);
      }
      draw();
    }
  </script>
</body>
</html>
