<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Valvet är Öppet!</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .final-video-box {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.45);
      margin: 14px 0 18px;
      background: #000;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
    }
    .final-video-box video {
      width: 100%;
      display: block;
      max-height: 48vh;
      object-fit: cover;
    }
    .unmute-overlay {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(19, 6, 10, 0.88);
      border: 1px solid var(--gold, #d4af37);
      color: var(--gold-light, #e6c86e);
      font-size: 0.82rem;
      font-weight: bold;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      z-index: 10;
    }
    .code-display {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 18px 0;
    }
    .code-digit {
      width: 56px;
      height: 68px;
      background: #13060a;
      border: 2px solid var(--gold);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      color: var(--gold-light);
      box-shadow: 0 0 16px rgba(212, 175, 55, 0.25);
    }
    .btn-reset-final {
      margin-top: 22px;
      background: transparent;
      border: 1px solid rgba(212, 175, 55, 0.35);
      color: var(--gold-light);
      font-size: 0.85rem;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="hud" class="hud-bar"></div>

    <div class="card" style="text-align: center;">
      <h2>Uppdraget Slutfört!</h2>
      <p class="muted">Ni har löst alla vinkällarens gåtor. Använd koden nedan för att öppna det fysiska hänglåset:</p>

      <div class="final-video-box">
        <video id="openVideo" src="open.mp4" autoplay loop playsinline controls></video>
        <button id="soundBtn" class="unmute-overlay" style="display: none;" onclick="enableSound()">🔊 Slå på ljud</button>
      </div>

      <div id="codeBox" class="code-display"></div>

      <button class="btn-reset-final" onclick="restartAll()">↺ Nollställ och spela igen</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const video = document.getElementById("openVideo");
    const soundBtn = document.getElementById("soundBtn");

    video.muted = false;
    const playPromise = video.play();
    if (playPromise !== undefined) {
      playPromise.catch(() => {
        video.muted = true;
        video.play();
        soundBtn.style.display = "block";
      });
    }

    function enableSound() {
      video.muted = false;
      video.play();
      soundBtn.style.display = "none";
    }

    document.addEventListener("pointerdown", function unlockAudio() {
      if (video.muted) {
        video.muted = false;
        video.play();
        soundBtn.style.display = "none";
      }
      document.removeEventListener("pointerdown", unlockAudio);
    }, { once: true });

    try { saveProgress("final.html", 3); } catch (e) {}
    try { renderHUD("Slutfört • 3/3", 3); } catch (e) {}

    const lockCode = (typeof GAME_CONFIG !== "undefined" && GAME_CONFIG.finalLockCode)
      ? String(GAME_CONFIG.finalLockCode)
      : "1842";

    const codeBox = document.getElementById("codeBox");
    codeBox.innerHTML = "";
    for (const ch of lockCode) {
      const div = document.createElement("div");
      div.className = "code-digit";
      div.textContent = ch;
      codeBox.appendChild(div);
    }

    function restartAll() {
      try {
        if (typeof resetProgress === "function") {
          resetProgress();
        } else {
          localStorage.removeItem("vinkallaren_escape_progress_v3");
        }
      } catch (e) {}
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
