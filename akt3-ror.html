<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Akt 3 - Rörsystemet</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .level-badge {
      display: inline-block;
      background: #1d0c13;
      border: 1px solid var(--gold);
      color: var(--gold-light);
      font-size: 0.8rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }
    .pipe-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 14px 0;
    }
    .endpoint {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.72rem;
      color: var(--gold-light);
      font-weight: bold;
      text-align: center;
    }
    .pipe-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      background: #110509;
      padding: 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .pipe-cell {
      width: 48px;
      height: 48px;
      background: #1d0c13;
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .pipe-cell.connected {
      background: #2b131d;
      border-color: var(--gold);
    }
    .pipe-cell.start-cell {
      align-self: start;
    }
    .pipe-cell.end-cell {
      align-self: end;
    }
    .pipe-cell svg {
      width: 38px;
      height: 38px;
      transition: transform 0.18s ease;
    }
    .pipe-line {
      stroke: #7a5c58;
      stroke-width: 14;
      stroke-linecap: butt;
      fill: none;
    }
    .pipe-cell.connected .pipe-line {
      stroke: var(--gold);
    }
    .pipe-center {
      fill: #7a5c58;
    }
    .pipe-cell.connected .pipe-center {
      fill: var(--gold);
    }
    @media (max-width: 380px) {
      .pipe-cell { width: 42px; height: 42px; }
      .pipe-cell svg { width: 32px; height: 32px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="hud" class="hud-bar"></div>

    <div class="card">
      <div id="levelBadge" class="level-badge">Bana 1 av 2 • Huvudledningen</div>
      <h2>Akt 3 • Källarens Rörsystem</h2>
      <p id="levelDesc" class="muted">Tryck på rören för att rotera dem. Skapa en helt sluten ledning från <strong>Tunnan (uppe t.v.)</strong> till <strong>Glaset (nere t.h.)</strong> utan några öppna läckande rörändar längs vägen.</p>

      <div class="pipe-wrapper">
        <div class="endpoint" style="align-self: flex-start; margin-top: 8px;">
          <span>🛢️</span>
          <span>IN →</span>
        </div>

        <div id="pipeGrid" class="pipe-grid"></div>

        <div class="endpoint" style="align-self: flex-end; margin-bottom: 8px;">
          <span>🍷</span>
          <span>→ UT</span>
        </div>
      </div>

      <button id="checkBtn" class="btn" onclick="checkFlow()">Öppna ventilen →</button>
      <div id="feedback" class="feedback"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    try { saveProgress("akt3-ror.html", 2); } catch (e) {}
    try { renderHUD("Akt 3 • 2/3", 2); } catch (e) {}

    // Riktningar: 0 = Upp, 1 = Höger, 2 = Ner, 3 = Vänster
    const DIRS = [
      { dr: -1, dc: 0 }, // 0: Upp
      { dr: 0, dc: 1 },  // 1: Höger
      { dr: 1, dc: 0 },  // 2: Ner
      { dr: 0, dc: -1 }  // 3: Vänster
    ];
    const OPPOSITE = [2, 3, 0, 1];

    // Grundöppningar vid rotation 0:
    // I: Upp(0), Ner(2)
    // L: Upp(0), Höger(1)
    // T: Höger(1), Ner(2), Vänster(3)
    const BASE_CONNECTIONS = {
      I: [0, 2],
      L: [0, 1],
      T: [1, 2, 3]
    };

    // Två matematiskt verifierade banor (0 = Bana 1, 1 = Bana 2 med T-korsningar)
    const LEVELS = [
      {
        badge: "Bana 1 av 2 • Huvudledningen",
        desc: "Tryck på rören för att rotera dem. Skapa en helt sluten ledning från <strong>Tunnan (uppe t.v.)</strong> till <strong>Glaset (nere t.h.)</strong> utan några öppna läckande rörändar längs vägen.",
        btnText: "Öppna ventil 1 →",
        grid: [
          [ { type: "I", rot: 0 }, { type: "L", rot: 3 }, { type: "I", rot: 1 }, { type: "L", rot: 0 }, { type: "L", rot: 1 } ],
          [ { type: "L", rot: 2 }, { type: "L", rot: 1 }, { type: "L", rot: 0 }, { type: "I", rot: 0 }, { type: "L", rot: 3 } ],
          [ { type: "I", rot: 1 }, { type: "L", rot: 2 }, { type: "I", rot: 1 }, { type: "L", rot: 0 }, { type: "I", rot: 0 } ],
          [ { type: "L", rot: 0 }, { type: "L", rot: 1 }, { type: "I", rot: 0 }, { type: "L", rot: 1 }, { type: "L", rot: 2 } ],
          [ { type: "I", rot: 0 }, { type: "L", rot: 2 }, { type: "L", rot: 3 }, { type: "I", rot: 1 }, { type: "I", rot: 0 } ]
        ]
      },
      {
        badge: "Bana 2 av 2 • Tryckkammaren (Svår)",
        desc: "Snyggt! Nu återstår sista tryckkammaren. Här finns <strong>T-korsningar</strong> – se till att alla grenar möts i en sluten slinga så att inget vin läcker ut!",
        btnText: "Öppna huvudventilen →",
        grid: [
          [ { type: "L", rot: 0 }, { type: "I", rot: 0 }, { type: "L", rot: 3 }, { type: "I", rot: 1 }, { type: "L", rot: 0 } ],
          [ { type: "L", rot: 2 }, { type: "L", rot: 0 }, { type: "L", rot: 3 }, { type: "I", rot: 0 }, { type: "L", rot: 0 } ],
          [ { type: "I", rot: 1 }, { type: "I", rot: 1 }, { type: "I", rot: 1 }, { type: "L", rot: 2 }, { type: "I", rot: 1 } ],
          [ { type: "L", rot: 3 }, { type: "L", rot: 2 }, { type: "T", rot: 0 }, { type: "T", rot: 2 }, { type: "L", rot: 1 } ],
          [ { type: "L", rot: 2 }, { type: "I", rot: 0 }, { type: "L", rot: 1 }, { type: "L", rot: 2 }, { type: "I", rot: 0 } ]
        ]
      }
    ];

    let currentLevel = 0;
    let board = [];
    let connectedSet = new Set();

    function loadLevel(idx) {
      currentLevel = idx;
      const lvl = LEVELS[idx];
      document.getElementById("levelBadge").textContent = lvl.badge;
      document.getElementById("levelDesc").innerHTML = lvl.desc;
      document.getElementById("checkBtn").textContent = lvl.btnText;
      const fb = document.getElementById("feedback");
      fb.className = "feedback";
      fb.textContent = "";

      board = lvl.grid.map(row => row.map(cell => ({ ...cell })));
      renderGrid();
    }

    function getOpenDirs(cell) {
      return BASE_CONNECTIONS[cell.type].map(d => (d + cell.rot) % 4);
    }

    function createPipeSVG(type) {
      if (type === "I") {
        return `<svg viewBox="0 0 100 100"><line class="pipe-line" x1="50" y1="0" x2="50" y2="100" /></svg>`;
      }
      if (type === "L") {
        return `<svg viewBox="0 0 100 100">
          <line class="pipe-line" x1="50" y1="0" x2="50" y2="50" />
          <line class="pipe-line" x1="50" y1="50" x2="100" y2="50" />
          <circle class="pipe-center" cx="50" cy="50" r="7" />
        </svg>`;
      }
      if (type === "T") {
        return `<svg viewBox="0 0 100 100">
          <line class="pipe-line" x1="0" y1="50" x2="100" y2="50" />
          <line class="pipe-line" x1="50" y1="50" x2="50" y2="100" />
          <circle class="pipe-center" cx="50" cy="50" r="7" />
        </svg>`;
      }
      return "";
    }

    function evaluateNetwork() {
      connectedSet = new Set();
      let leakCount = 0;
      let reachedExit = false;

      const startOpens = getOpenDirs(board[0][0]);
      if (!startOpens.includes(3)) {
        return { connectedSet, leakCount: 0, reachedExit: false, started: false };
      }

      const queue = [{ r: 0, c: 0, fromDir: 3 }];
      connectedSet.add("0,0");

      while (queue.length > 0) {
        const { r, c } = queue.shift();
        const opens = getOpenDirs(board[r][c]);

        for (const d of opens) {
          if (r === 0 && c === 0 && d === 3) continue;
          if (r === 4 && c === 4 && d === 1) {
            reachedExit = true;
            continue;
          }

          const nr = r + DIRS[d].dr;
          const nc = c + DIRS[d].dc;

          if (nr < 0 || nr >= 5 || nc < 0 || nc >= 5) {
            leakCount++;
            continue;
          }

          const neighborOpens = getOpenDirs(board[nr][nc]);
          if (!neighborOpens.includes(OPPOSITE[d])) {
            leakCount++;
            continue;
          }

          const key = `${nr},${nc}`;
          if (!connectedSet.has(key)) {
            connectedSet.add(key);
            queue.push({ r: nr, c: nc, fromDir: OPPOSITE[d] });
          }
        }
      }

      return { connectedSet, leakCount, reachedExit, started: true };
    }

    function renderGrid() {
      const status = evaluateNetwork();
      const gridEl = document.getElementById("pipeGrid");
      gridEl.innerHTML = "";

      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
          const cellData = board[r][c];
          const div = document.createElement("div");
          div.className = "pipe-cell";
          if (status.connectedSet.has(`${r},${c}`)) {
            div.classList.add("connected");
          }
          div.innerHTML = createPipeSVG(cellData.type);
          div.firstElementChild.style.transform = `rotate(${cellData.rot * 90}deg)`;

          div.onclick = () => {
            cellData.rot = (cellData.rot + 1) % 4;
            renderGrid();
          };
          gridEl.appendChild(div);
        }
      }
    }

    function checkFlow() {
      const fb = document.getElementById("feedback");
      const status = evaluateNetwork();

      if (!status.started) {
        fb.className = "feedback error";
        fb.textContent = "Inloppet uppe till vänster (0,0) är inte kopplat till tunnan.";
        return;
      }
      if (status.leakCount > 0) {
        fb.className = "feedback error";
        fb.textContent = `Systemet läcker! Det finns ${status.leakCount} öppen rörände som inte är sluten.`;
        return;
      }
      if (!status.reachedExit) {
        fb.className = "feedback error";
        fb.textContent = "Vinet når inte fram till utloppet nere till höger ännu.";
        return;
      }

      if (currentLevel < LEVELS.length - 1) {
        fb.className = "feedback success";
        fb.textContent = "Bana 1 klarad! Laddar nästa tryckkammare...";
        setTimeout(() => {
          loadLevel(currentLevel + 1);
        }, 1100);
      } else {
        fb.className = "feedback success";
        fb.textContent = "Båda rörsystemen är helt täta! Vinet strömmar ner i glaset!";
        try { saveProgress("akt3-telefon.html", 2); } catch (e) {}
        setTimeout(() => {
          window.location.href = "akt3-telefon.html";
        }, 900);
      }
    }

    loadLevel(0);
  </script>
</body>
</html>
