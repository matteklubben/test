<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Akt 1 - Signal</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .morse-lamp-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 22px 0;
    }
    .morse-lamp {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      background: #210d14;
      border: 3px solid var(--gold);
      box-shadow: inset 0 0 18px #000;
      transition: background 0.04s, box-shadow 0.04s;
      margin-bottom: 14px;
    }
    .morse-lamp.on {
      background: #ffe066;
      box-shadow: 0 0 40px #ffe066, inset 0 0 12px #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="hud" class="hud-bar"></div>

    <div class="card" id="puzzleCard">
      <h2>Akt 1 • Sändning</h2>
      <p class="muted" style="text-align:center;">Slå på ljudet på mobilen.</p>

      <div class="morse-lamp-wrap">
        <div id="lamp" class="morse-lamp"></div>
      </div>

      <button class="btn btn-secondary" id="playBtn" onclick="playMorse()" style="margin-bottom:16px;">▶ Ta emot sändning</button>

      <input type="text" id="morseInput" placeholder="ORD..." autocomplete="off" />
      <button class="btn" onclick="checkMorse()">Bekräfta →</button>
      <div id="feedback" class="feedback"></div>
    </div>

    <div class="card" id="rewardCard" style="display:none;">
      <div class="digit-reveal">
        <p style="margin:0; color:var(--gold); font-weight:700;">AKT 1 SLUTFÖRD</p>
        <div class="digit-big" id="revealedDigit"></div>
        <p style="margin:0;">Första siffran är upplåst.</p>
      </div>
      <a href="akt2-lightsout.html" class="btn btn-gold">Fortsätt till Akt 2 →</a>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    renderHUD("Akt 1 • 3/3", 0);

    // Autentiskt morse-tempo (ca 13 WPM -> dit = 95ms, dah = 285ms)
    // Ordet är TOMTE:
    // T: -
    // O: ---
    // M: --
    // T: -
    // E: .
    const DIT = 95;
    const DAH = DIT * 3;
    const INTRA = DIT;
    const LETTER_GAP = DIT * 3;

    const MORSE_WORD = [
      [DAH],                // T
      [DAH, DAH, DAH],      // O
      [DAH, DAH],           // M
      [DAH],                // T
      [DIT]                 // E
    ];

    let audioCtx = null;
    let isPlaying = false;

    function beep(durationMs) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 680; // Klassisk CW-morseton (680 Hz)

      const now = audioCtx.currentTime;
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.35, now + 0.008);
      gain.gain.setValueAtTime(0.35, now + (durationMs / 1000) - 0.008);
      gain.gain.exponentialRampToValueAtTime(0.001, now + (durationMs / 1000));

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + durationMs / 1000);
    }

    async function playMorse() {
      if (isPlaying) return;
      isPlaying = true;
      const btn = document.getElementById("playBtn");
      const lamp = document.getElementById("lamp");
      btn.disabled = true;

      for (let l = 0; l < MORSE_WORD.length; l++) {
        const symbols = MORSE_WORD[l];
        for (let s = 0; s < symbols.length; s++) {
          const dur = symbols[s];
          lamp.classList.add("on");
          beep(dur);
          await new Promise(r => setTimeout(r, dur));
          lamp.classList.remove("on");
          if (s < symbols.length - 1) {
            await new Promise(r => setTimeout(r, INTRA));
          }
        }
        if (l < MORSE_WORD.length - 1) {
          await new Promise(r => setTimeout(r, LETTER_GAP));
        }
      }

      btn.disabled = false;
      isPlaying = false;
    }

    function checkMorse() {
      const val = document.getElementById("morseInput").value.trim().toUpperCase();
      const fb = document.getElementById("feedback");
      if (val === "TOMTE") {
        document.getElementById("puzzleCard").style.display = "none";
        document.getElementById("rewardCard").style.display = "block";
        document.getElementById("revealedDigit").textContent = VAULT_CONFIG.digit1;
        renderHUD("Akt 1 Klar", 1);
      } else {
        fb.className = "feedback error";
        fb.textContent = "Felaktigt ord.";
      }
    }

    document.getElementById("morseInput").addEventListener("keyup", (e) => {
      if (e.key === "Enter") checkMorse();
    });
  </script>
</body>
</html>
