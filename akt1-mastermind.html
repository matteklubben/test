<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Akt 1 - Färgkoden</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .mm-board {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 14px 0;
    }
    .mm-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #14070c;
      border: 1px solid rgba(212, 175, 55, 0.22);
      border-radius: 10px;
      padding: 6px 10px;
      min-height: 44px;
    }
    .mm-row.active {
      border-color: var(--gold);
      background: #1d0c13;
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.18);
    }
    .mm-row-num {
      font-size: 0.78rem;
      color: #9e8783;
      width: 22px;
      font-weight: bold;
    }
    .mm-pegs {
      display: flex;
      gap: 8px;
    }
    .mm-peg {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #0b0306;
      border: 1px dashed rgba(212, 175, 55, 0.35);
      cursor: pointer;
    }
    .mm-peg.filled {
      border-style: solid;
      border-color: rgba(255, 255, 255, 0.55);
    }
    .mm-clues {
      display: grid;
      grid-template-columns: repeat(2, 11px);
      gap: 4px;
    }
    .mm-clue-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #241017;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .mm-clue-dot.black {
      background: #2ecc71;
      border-color: #2ecc71;
      box-shadow: 0 0 5px rgba(46, 204, 113, 0.6);
    }
    .mm-clue-dot.white {
      background: #f1c40f;
      border-color: #f1c40f;
    }
    .mm-palette {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 7px;
      margin: 12px 0;
    }
    .mm-color-btn {
      height: 42px;
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      cursor: pointer;
      transition: transform 0.1s;
    }
    .mm-color-btn:active {
      transform: scale(0.92);
    }
    .mm-controls {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-clear {
      background: transparent;
      border: 1px solid rgba(212, 175, 55, 0.45);
      color: var(--gold-light);
      border-radius: 10px;
      padding: 12px 14px;
      font-weight: bold;
      cursor: pointer;
      width: 34%;
    }
    .btn-check {
      width: 66%;
      margin: 0;
    }
    .mm-legend {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: #cbb8b4;
      background: #13060a;
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 8px;
      padding: 7px 10px;
      margin-bottom: 10px;
    }
    .win-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }
    .btn-secondary-gold {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold-light);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="hud" class="hud-bar"></div>

    <div class="card">
      <h2>Akt 1 • Källarens Färglås</h2>
      <p class="muted">Knäck koden på 4 färger (samma färg kan förekomma flera gånger). Det räcker att klara spelet <strong>1 gång</strong> för att gå vidare – men du kan spela fler omgångar om du vill.</p>

      <div class="mm-legend">
        <span>🟢 Rätt färg & plats</span>
        <span>🟡 Rätt färg, fel plats</span>
        <span id="solvedCounter">Klarade: 0</span>
      </div>

      <!-- Klassiskt Mastermind-bräde med 8 rader -->
      <div id="mmBoard" class="mm-board"></div>

      <!-- Färgpalett och knappar längst ner som i originalet -->
      <div id="inputSection">
        <div id="mmPalette" class="mm-palette"></div>
        <div class="mm-controls">
          <button class="btn-clear" onclick="clearCurrentGuess()">Rensa</button>
          <button class="btn btn-check" onclick="checkCurrentGuess()">Testa kod</button>
        </div>
      </div>

      <div id="feedback" class="feedback"></div>

      <div id="winActions" class="win-actions" style="display: none;">
        <button class="btn" onclick="goNextChallenge()">Gå vidare till nästa utmaning →</button>
        <button class="btn-secondary-gold" onclick="resetBoardForNewRound()">↻ Spela en omgång till</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    try { saveProgress("akt1-mastermind.html", 0); } catch (e) {}
    try { renderHUD("Akt 1 • 2/3", 0); } catch (e) {}

    const COLORS = [
      { id: "red",    hex: "#e74c3c" },
      { id: "gold",   hex: "#f1c40f" },
      { id: "green",  hex: "#2ecc71" },
      { id: "blue",   hex: "#3498db" },
      { id: "purple", hex: "#9b59b6" },
      { id: "white",  hex: "#ecf0f1" }
    ];

    const CODE_LEN = 4;
    const MAX_ROWS = 8;

    let secret = [];
    let history = [];
    let currentGuess = [null, null, null, null];
    let roundFinished = false;
    let solvedCount = 0;

    function createSecret() {
      return Array.from({ length: CODE_LEN }, () => COLORS[Math.floor(Math.random() * COLORS.length)].id);
    }

    function renderPalette() {
      const pal = document.getElementById("mmPalette");
      pal.innerHTML = "";
      COLORS.forEach(c => {
        const btn = document.createElement("button");
        btn.className = "mm-color-btn";
        btn.style.background = c.hex;
        btn.onclick = () => {
          if (roundFinished) return;
          const idx = currentGuess.indexOf(null);
          if (idx !== -1) {
            currentGuess[idx] = c.id;
            renderBoard();
          }
        };
        pal.appendChild(btn);
      });
    }

    function renderBoard() {
      const board = document.getElementById("mmBoard");
      board.innerHTML = "";

      for (let r = 0; r < MAX_ROWS; r++) {
        const rowDiv = document.createElement("div");
        const isCurrent = !roundFinished && r === history.length;
        rowDiv.className = "mm-row" + (isCurrent ? " active" : "");

        const numSpan = document.createElement("span");
        numSpan.className = "mm-row-num";
        numSpan.textContent = r + 1;
        rowDiv.appendChild(numSpan);

        const pegsDiv = document.createElement("div");
        pegsDiv.className = "mm-pegs";

        const rowData = r < history.length ? history[r].guess : (isCurrent ? currentGuess : [null, null, null, null]);

        for (let c = 0; c < CODE_LEN; c++) {
          const peg = document.createElement("div");
          peg.className = "mm-peg";
          const colId = rowData[c];
          if (colId) {
            const colObj = COLORS.find(x => x.id === colId);
            peg.style.background = colObj.hex;
            peg.classList.add("filled");
          }
          if (isCurrent) {
            peg.onclick = () => {
              currentGuess[c] = null;
              renderBoard();
            };
          }
          pegsDiv.appendChild(peg);
        }
        rowDiv.appendChild(pegsDiv);

        const cluesDiv = document.createElement("div");
        cluesDiv.className = "mm-clues";
        const exact = r < history.length ? history[r].exact : 0;
        const partial = r < history.length ? history[r].partial : 0;

        for (let i = 0; i < exact; i++) {
          const d = document.createElement("div");
          d.className = "mm-clue-dot black";
          cluesDiv.appendChild(d);
        }
        for (let i = 0; i < partial; i++) {
          const d = document.createElement("div");
          d.className = "mm-clue-dot white";
          cluesDiv.appendChild(d);
        }
        for (let i = 0; i < CODE_LEN - exact - partial; i++) {
          const d = document.createElement("div");
          d.className = "mm-clue-dot";
          cluesDiv.appendChild(d);
        }

        rowDiv.appendChild(cluesDiv);
        board.appendChild(rowDiv);
      }
    }

    function clearCurrentGuess() {
      if (roundFinished) return;
      currentGuess = [null, null, null, null];
      renderBoard();
    }

    function evaluate(guess, target) {
      let exact = 0;
      let partial = 0;
      const tRest = [];
      const gRest = [];

      for (let i = 0; i < CODE_LEN; i++) {
        if (guess[i] === target[i]) {
          exact++;
        } else {
          tRest.push(target[i]);
          gRest.push(guess[i]);
        }
      }
      for (const g of gRest) {
        const idx = tRest.indexOf(g);
        if (idx !== -1) {
          partial++;
          tRest.splice(idx, 1);
        }
      }
      return { exact, partial };
    }

    function checkCurrentGuess() {
      if (roundFinished) return;
      const fb = document.getElementById("feedback");

      if (currentGuess.includes(null)) {
        fb.className = "feedback error";
        fb.textContent = "Fyll alla 4 platser innan du testar koden.";
        return;
      }

      const res = evaluate(currentGuess, secret);
      history.push({ guess: [...currentGuess], exact: res.exact, partial: res.partial });
      currentGuess = [null, null, null, null];
      renderBoard();

      if (res.exact === CODE_LEN) {
        roundFinished = true;
        solvedCount++;
        document.getElementById("solvedCounter").textContent = `Klarade: ${solvedCount}`;
        try { saveProgress("akt1-morse.html", 0); } catch (e) {}

        fb.className = "feedback success";
        fb.textContent = solvedCount === 1
          ? "Snyggt! Du knäckte färglåset. Gå vidare till nästa utmaning eller spela en omgång till!"
          : `Grymt! Du har klarat ${solvedCount} omgångar!`;

        document.getElementById("inputSection").style.display = "none";
        document.getElementById("winActions").style.display = "flex";
        return;
      }

      if (history.length >= MAX_ROWS) {
        roundFinished = true;
        fb.className = "feedback error";
        fb.textContent = "Slut på försök! Ny kod laddas...";
        setTimeout(() => {
          resetBoardForNewRound();
        }, 1600);
        return;
      }

      fb.className = "feedback";
      fb.textContent = "";
    }

    function resetBoardForNewRound() {
      secret = createSecret();
      history = [];
      currentGuess = [null, null, null, null];
      roundFinished = false;

      const fb = document.getElementById("feedback");
      fb.className = "feedback";
      fb.textContent = "";

      document.getElementById("inputSection").style.display = "block";
      if (solvedCount > 0) {
        document.getElementById("winActions").style.display = "flex";
      } else {
        document.getElementById("winActions").style.display = "none";
      }

      renderBoard();
    }

    function goNextChallenge() {
      try { saveProgress("akt1-morse.html", 0); } catch (e) {}
      window.location.href = "akt1-morse.html";
    }

    secret = createSecret();
    renderPalette();
    renderBoard();
  </script>
</body>
</html>
