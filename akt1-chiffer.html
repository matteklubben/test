<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Akt 1 - Krypterat Lås</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div id="hud" class="hud-bar"></div>

    <div class="card">
      <p style="text-align: center; color: var(--gold-light); font-weight: bold; margin-bottom: 12px;">
        Lycka till! </br>
      mvh </br>10 - 15 - 14 - 1 - 19
      </p>
      <h2>Akt 1 • Chifferlås</h2>
      <div class="clue-box" style="font-size:1.25rem; padding:22px 12px;">
        16 - 5 - 16 - 16 - 1 - 18 - 11 - 1 - 11 - 1
      </div>

      <input type="text" id="cipherInput" placeholder="SVAR..." autocomplete="off" />
      <button class="btn" onclick="checkAnswer()">Verifiera →</button>
      <div id="feedback" class="feedback"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    saveProgress("akt1-chiffer.html", 0);
    renderHUD("Akt 1 • 1/3", 0);

    function checkAnswer() {
      const val = document.getElementById("cipherInput").value.trim().toUpperCase();
      const fb = document.getElementById("feedback");
      if (val === "PEPPARKAKA") {
        fb.className = "feedback success";
        fb.textContent = "Åtkomst beviljad.";
        saveProgress("akt1-mastermind.html", 0);
        setTimeout(() => {
          window.location.href = "akt1-mastermind.html";
        }, 700);
      } else {
        fb.className = "feedback error";
        fb.textContent = "Felaktigt svar.";
      }
    }

    document.getElementById("cipherInput").addEventListener("keyup", (e) => {
      if (e.key === "Enter") checkAnswer();
    });
  </script>
</body>
</html>
