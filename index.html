<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vinkällarens Hemlighet</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0406;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .start-wrapper {
      width: 100%;
      max-width: 520px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-sizing: border-box;
    }
    .video-box {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.35);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.75);
      background: #000;
    }
    .video-box video {
      width: 100%;
      display: block;
      max-height: 72vh;
      object-fit: cover;
    }
    .btn-reset-small {
      background: transparent;
      border: 1px solid rgba(212, 175, 55, 0.35);
      color: var(--gold-light, #e6c86e);
      font-size: 0.85rem;
      padding: 9px 16px;
      border-radius: 8px;
      cursor: pointer;
      width: auto;
      opacity: 0.85;
      transition: opacity 0.2s, border-color 0.2s;
    }
    .btn-reset-small:hover {
      opacity: 1;
      border-color: var(--gold, #d4af37);
    }
  </style>
</head>
<body>
  <div class="start-wrapper">
    <div class="video-box">
      <video id="introVideo" src="intro.mp4" autoplay muted loop playsinline controls></video>
    </div>

    <button id="mainActionBtn" class="btn" onclick="startOrContinue()">Starta äventyret →</button>
    <button id="resetBtn" class="btn-reset-small" style="display: none;" onclick="resetGame()">Starta från början</button>
  </div>

  <script src="config.js"></script>
  <script>
    const FIRST_LEVEL = "akt1-chiffer.html";
    let savedPage = null;

    try {
      const raw = localStorage.getItem("vinkallaren_escape_progress_v3");
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.page && parsed.page !== "index.html") {
          savedPage = parsed.page;
        }
      }
    } catch (e) {}

    const mainBtn = document.getElementById("mainActionBtn");
    const resetBtn = document.getElementById("resetBtn");

    if (savedPage) {
      mainBtn.textContent = "Fortsätt äventyret →";
      resetBtn.style.display = "inline-block";
    } else {
      mainBtn.textContent = "Starta äventyret →";
      resetBtn.style.display = "none";
    }

    function startOrContinue() {
      if (savedPage) {
        window.location.href = savedPage;
      } else {
        try { saveProgress(FIRST_LEVEL, 0); } catch (e) {}
        window.location.href = FIRST_LEVEL;
      }
    }

    function resetGame() {
      try {
        if (typeof resetProgress === "function") {
          resetProgress();
        } else {
          localStorage.removeItem("vinkallaren_escape_progress_v3");
        }
      } catch (e) {}
      savedPage = null;
      mainBtn.textContent = "Starta äventyret →";
      resetBtn.style.display = "none";
    }
  </script>
</body>
</html>
