<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vinkällarens Hemlighet</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0406;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .start-wrapper {
      width: 100%;
      max-width: 520px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      box-sizing: border-box;
    }
    .big-start-btn {
      width: 100%;
      padding: 26px 20px;
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #2b131d 0%, #14070c 100%);
      color: var(--gold-light, #e6c86e);
      border: 2px solid var(--gold, #d4af37);
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 0 28px rgba(212, 175, 55, 0.28);
      transition: transform 0.15s, box-shadow 0.2s;
    }
    .big-start-btn:active {
      transform: scale(0.97);
    }
    .video-box {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.4);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.8);
      background: #000;
    }
    .video-box video {
      width: 100%;
      display: block;
      max-height: 70vh;
      object-fit: cover;
    }
    .btn-reset-small {
      background: transparent;
      border: 1px solid rgba(212, 175, 55, 0.35);
      color: var(--gold-light, #e6c86e);
      font-size: 0.85rem;
      padding: 9px 16px;
      border-radius: 8px;
      cursor: pointer;
      width: auto;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="start-wrapper">
    <!-- Steg 1: Stor STARTA-knapp som låser upp ljudet i alla mobiler -->
    <button id="bigStartBtn" class="big-start-btn" onclick="launchIntro()">▶ STARTA</button>

    <!-- Steg 2: Filmen och knapparna som visas direkt vid klick -->
    <div id="videoContainer" class="video-box" style="display: none;">
      <video id="introVideo" src="intro.mp4" playsinline controls></video>
    </div>

    <button id="mainActionBtn" class="btn" style="display: none;" onclick="startOrContinue()">Starta äventyret →</button>
    <button id="resetBtn" class="btn-reset-small" style="display: none;" onclick="resetGame()">Starta från början</button>
  </div>

  <script src="config.js"></script>
  <script>
    const FIRST_LEVEL = "akt1-chiffer.html";
    let savedPage = null;

    try {
      const raw = localStorage.getItem("vinkallaren_escape_progress_v3");
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.page && parsed.page !== "index.html") {
          savedPage = parsed.page;
        }
      }
    } catch (e) {}

    const bigStartBtn = document.getElementById("bigStartBtn");
    const videoContainer = document.getElementById("videoContainer");
    const introVideo = document.getElementById("introVideo");
    const mainBtn = document.getElementById("mainActionBtn");
    const resetBtn = document.getElementById("resetBtn");

    // Om spelaren redan kommit en bit i äventyret hoppar vi förbi STARTA-steget och visar Fortsätt direkt
    if (savedPage) {
      bigStartBtn.style.display = "none";
      videoContainer.style.display = "block";
      mainBtn.style.display = "block";
      mainBtn.textContent = "Fortsätt äventyret →";
      resetBtn.style.display = "inline-block";
    }

    function launchIntro() {
      bigStartBtn.style.display = "none";
      videoContainer.style.display = "block";
      mainBtn.style.display = "block";
      mainBtn.textContent = "Starta äventyret →";

      introVideo.muted = false;
      introVideo.play();
    }

    function startOrContinue() {
      if (savedPage) {
        window.location.href = savedPage;
      } else {
        try { saveProgress(FIRST_LEVEL, 0); } catch (e) {}
        window.location.href = FIRST_LEVEL;
      }
    }

    function resetGame() {
      try {
        if (typeof resetProgress === "function") {
          resetProgress();
        } else {
          localStorage.removeItem("vinkallaren_escape_progress_v3");
        }
      } catch (e) {}
      savedPage = null;
      videoContainer.style.display = "none";
      introVideo.pause();
      introVideo.currentTime = 0;
      mainBtn.style.display = "none";
      resetBtn.style.display = "none";
      bigStartBtn.style.display = "block";
    }
  </script>
</body>
</html>
